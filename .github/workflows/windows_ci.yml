name: CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows CI
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Get dependencies
      run: flutter pub get

    - name: Generate Rust bindings
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        # 安装 FRB 代码生成器并重新生成 Dart 绑定
        cargo install flutter_rust_bridge_codegen --version 2.11.1 2>&1
        # 生成 Dart 绑定（二进制在 ~/.cargo/bin/ 中，已在 PATH）
        flutter_rust_bridge_codegen generate 2>&1

    - name: Check Rust compilation
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "=== Running cargo check ==="
        Push-Location rust
        cargo check 2>&1 | Write-Host
        $rustExitCode = $LASTEXITCODE
        Pop-Location
        
        if ($rustExitCode -ne 0) {
            Write-Host "ERROR: cargo check failed with exit code $rustExitCode" -ForegroundColor Red
            exit 1
        }
        
        Write-Host "=== Rust compilation passed ===" -ForegroundColor Green

    - name: Build Windows
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        flutter build windows --verbose 2>&1 | Write-Host
        if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: flutter build windows failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit 1
        }

    - name: Download dll
      shell: pwsh
      run: |
        $BassDir = "build\windows\x64\runner\Release\BASS"
        New-Item -ItemType Directory -Path $BassDir -Force | Out-Null
        
        # 下载 BASS 主库和插件
        $urls = @{
            "bass24.zip"     = "https://www.un4seen.com/files/bass24.zip"
            "basswasapi24.zip" = "https://www.un4seen.com/files/basswasapi24.zip"
            "bassape24.zip"  = "https://www.un4seen.com/files/bassape24.zip"
            "bassdsd24.zip"  = "https://www.un4seen.com/files/bassdsd24.zip"
            "bassflac24.zip" = "https://www.un4seen.com/files/bassflac24.zip"
            "bassmidi24.zip" = "https://www.un4seen.com/files/bassmidi24.zip"
            "bassopus24.zip" = "https://www.un4seen.com/files/bassopus24.zip"
            "basswv24.zip"   = "https://www.un4seen.com/files/basswv24.zip"
        }
        foreach ($entry in $urls.GetEnumerator()) {
            Write-Host "Downloading $($entry.Key)..."
            curl.exe -sL $entry.Value -o $entry.Key
            Write-Host "Extracting x64\* to $BassDir..."
            $tmpDir = "$([System.IO.Path]::GetFileNameWithoutExtension($entry.Key))_tmp"
            New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
            Expand-Archive -Path $entry.Key -DestinationPath $tmpDir -Force
            if (Test-Path "$tmpDir\x64") {
                Copy-Item -Path "$tmpDir\x64\*" -Destination $BassDir -Force
            }
            Remove-Item -Path $tmpDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $entry.Key -Force -ErrorAction SilentlyContinue
        }
        Write-Host "=== BASS 目录文件清单 ==="
        Get-ChildItem -Path $BassDir | Select-Object Length, Name | Format-Table -AutoSize

    - name: List Release directory
      shell: pwsh
      run: Get-ChildItem -Recurse build\windows\x64\runner\Release | Select-Object Mode, Length, Name | Format-Table -AutoSize

    - name: Clone and build desktop_lyric
      shell: pwsh
      run: |
        git clone https://github.com/dj2733721464-cyber/desktop_lyric.git ../desktop_lyric-main
        Push-Location ../desktop_lyric-main
        flutter pub get
        flutter pub run build_runner build --delete-conflicting-outputs
        flutter build windows --release
        Pop-Location
        $DestDir = "build\windows\x64\runner\Release\desktop_lyric"
        New-Item -ItemType Directory -Path $DestDir -Force | Out-Null
        Copy-Item -Path "../desktop_lyric-main/build/windows/x64/runner/Release/*" -Destination $DestDir -Recurse -Force

    - name: Package artifact
      shell: pwsh
      run: |
        Compress-Archive -Path build\windows\x64\runner\Release\ -DestinationPath coriander_player.zip -Force

    - name: Build SFX installer
      shell: pwsh
      run: |
        # 编译 C# 自解压程序，内嵌 ZIP 包
        $tmpDir = "build\sfx_build"
        New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
        
        # 复制必要文件
        Copy-Item .github\workflows\sfx_installer.cs $tmpDir\
        Copy-Item coriander_player.zip $tmpDir\
        if (Test-Path "app_icon.ico") { Copy-Item app_icon.ico $tmpDir\ }
        
        # 查找 .NET 4.x 的 csc.exe（需要 4.5+ 才能用 System.IO.Compression）
        $csc = "${env:windir}\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        if (-not (Test-Path $csc)) {
          $csc = "${env:windir}\Microsoft.NET\Framework\v4.0.30319\csc.exe"
        }
        Write-Host "Using C# compiler: $csc"
        if (-not (Test-Path $csc)) { Write-Host "csc.exe (v4.x) not found!" ; exit 1 }
        
        # System.IO.Compression 在 .NET 4.5+ 的 FAC 中
        $facDir = Split-Path $csc -Parent
        
        $outExe = "CorianderPlayer_Upgrade_v1.5.2.exe"
        Push-Location $tmpDir
        $iconOpt = if (Test-Path "app_icon.ico") { "/win32icon:app_icon.ico" } else { "" }
        & $csc /target:exe /resource:coriander_player.zip /out:$outExe $iconOpt sfx_installer.cs `
          /reference:"$facDir\System.IO.Compression.dll" `
          /reference:"$facDir\System.IO.Compression.FileSystem.dll" 2>&1 | Write-Host
        Pop-Location
        
        # 复制结果到输出目录
        if (Test-Path "$tmpDir\$outExe") {
          Copy-Item "$tmpDir\$outExe" . -Force
          Write-Host "=== SFX 安装包 ==="
          Get-ChildItem $outExe | Select-Object Length, Name
        } else {
          Write-Host "SFX 构建失败，仅上传 ZIP 包"
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "Coriander Player v1.5.2"
        path: |
          coriander_player.zip
          CorianderPlayer_Upgrade_v1.5.2.exe
