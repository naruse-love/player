name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Windows CI
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        
    - name: Get dependencies
      run: flutter pub get

    - name: Build Windows
      run: flutter build windows

    - name: Download dll
      shell: pwsh
      run: |
        $BassDir = "build\windows\x64\runner\Release\BASS"
        New-Item -ItemType Directory -Path $BassDir -Force | Out-Null
        
        # 下载 BASS 主库和插件
        $urls = @{
            "bass24.zip"     = "https://www.un4seen.com/files/bass24.zip"
            "basswasapi24.zip" = "https://www.un4seen.com/files/basswasapi24.zip"
            "bassape24.zip"  = "https://www.un4seen.com/files/bassape24.zip"
            "bassdsd24.zip"  = "https://www.un4seen.com/files/bassdsd24.zip"
            "bassflac24.zip" = "https://www.un4seen.com/files/bassflac24.zip"
            "bassmidi24.zip" = "https://www.un4seen.com/files/bassmidi24.zip"
            "bassopus24.zip" = "https://www.un4seen.com/files/bassopus24.zip"
            "basswv24.zip"   = "https://www.un4seen.com/files/basswv24.zip"
        }
        foreach ($entry in $urls.GetEnumerator()) {
            Write-Host "Downloading $($entry.Key)..."
            curl.exe -sL $entry.Value -o $entry.Key
            Write-Host "Extracting x64\* to $BassDir..."
            $tmpDir = "$([System.IO.Path]::GetFileNameWithoutExtension($entry.Key))_tmp"
            New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
            Expand-Archive -Path $entry.Key -DestinationPath $tmpDir -Force
            if (Test-Path "$tmpDir\x64") {
                Copy-Item -Path "$tmpDir\x64\*" -Destination $BassDir -Force
            }
            Remove-Item -Path $tmpDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $entry.Key -Force -ErrorAction SilentlyContinue
        }
        Write-Host "=== BASS 目录文件清单 ==="
        Get-ChildItem -Path $BassDir | Select-Object Length, Name | Format-Table -AutoSize

    - name: List Release directory
      shell: pwsh
      run: Get-ChildItem -Recurse build\windows\x64\runner\Release | Select-Object Mode, Length, Name | Format-Table -AutoSize

    - name: Download desktop_lyric
      shell: pwsh
      run: |
        $tag = (curl.exe -sL "https://api.github.com/repos/Ferry-200/desktop_lyric/releases/latest" | Select-String -Pattern '"tag_name":\s*"([^"]+)"' | % { $_.Matches.Groups[1].Value })
        if (-not $tag) { Write-Host "No release found"; exit 0 }
        Write-Host "Downloading desktop_lyric $tag"
        curl.exe -sL "https://github.com/Ferry-200/desktop_lyric/releases/download/$tag/desktop_lyric-windows-x64.zip" -o desktop_lyric.zip
        if (Test-Path desktop_lyric.zip) {
          Expand-Archive -Path desktop_lyric.zip -DestinationPath build\windows\x64\runner\Release\desktop_lyric -Force
        }

    - name: Package artifact
      shell: pwsh
      run: |
        Compress-Archive -Path build\windows\x64\runner\Release\ -DestinationPath coriander_player.zip -Force

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "Coriander Player Test Version"
        path: coriander_player.zip
